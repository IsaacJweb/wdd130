<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Structure</title>
    <meta name="description" content="A basic HTML structure example using semantic HTML elements">
    <meta name="author" content="Isaac Jaramillo">
</head>

<body>
    <header>
        <img src="images/basic-logo.png" alt="HTML Layout Logo" width="128" height="128">
    </header>
    <nav>
        <ul>
            <li><a href="https://byui.edu">BYU-Idaho</a></li>
            <li><a href="https://churchofjesuschrist.org">The Church</a></li>
        </ul>
    </nav>
    <main>
        <h1>Basic HTML Structure</h1>
        <section>
            <h2>Heading 1</h2>
            <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Distinctio, excepturi?</p>
        </section>
        <section>
            <h2>Heading 2</h2>
            <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Architecto, dolorum!</p>
        </section>
    </main>
    <aside>
        <img
          src="https://content.churchofjesuschrist.org/templesldsorg/bc/Temples/photo-galleries/mesa-arizona/800x500/mesa_arizona_temple_news_conference.jpeg"
          alt="Mesa Arizona Temple" width="200">
    </aside>
    <footer>
        <p>⚡ Isaac Jaramillo</p>
    </footer>
</body>

</html>
